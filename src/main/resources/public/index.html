<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Ville</title>
    <link rel="stylesheet" href="style.css">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body>

<div class="container">
    <h2 class="mb-3" id="nom_banque">Ma banque</h2>
    <table class="table table-striped table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Numero compte</th>
            <th>Solde</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<form id="myForm" class="p-3">
    <div class="mb-3">
        <label for="name" class="form-label">Num compte 1</label>
        <input type="text" id="name" class="form-control" placeholder="" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Num compte 2</label>
        <input type="text" id="email" class="form-control" placeholder="" required>
    </div>
    <div class="mb-3">
        <label for="amount" class="form-label">Montant</label>
        <input type="number" id="amount" class="form-control" placeholder="" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script src="script.js"></script>
</body>
</html>
